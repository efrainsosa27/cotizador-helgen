# capri.helgen.online — API de CAPRI (etapa 1). Instalar en /etc/nginx/sites-available/ y enlazar en sites-enabled;
# luego: sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d capri.helgen.online
# (certbot agrega el bloque 443 y la redirección de 80 → 443, igual que en drogheda.helgen.online).
#
# El servicio escucha solo en 127.0.0.1:8090. La interfaz sigue en Cloudflare: solo cambia API_URL a
# https://capri.helgen.online/api. Las cabeceras CORS las pone el servicio (orígenes en /etc/capri/capri.json); aquí
# solo en las respuestas que da nginx (límite, reinicio), para que el navegador pueda leer el mensaje.

limit_req_zone $binary_remote_addr zone=capri_api:10m rate=10r/s;

map $http_origin $capri_origen {
    default "";
    "https://cotizador-helgen.cotizador-helgen.workers.dev" $http_origin;
    "http://127.0.0.1:8788" $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name capri.helgen.online;

    access_log /var/log/nginx/capri.access.log;
    error_log /var/log/nginx/capri.error.log warn;

    # Comprobantes, cotizaciones del proveedor y fotos por renglón van en base64 dentro del JSON
    client_max_body_size 50m;
    client_body_buffer_size 1m;

    location = /api {
        # La oficina sale por una sola IP: límite holgado (la interfaz consulta cada 20 s por pestaña)
        limit_req zone=capri_api burst=80 nodelay;
        limit_req_status 429;
        error_page 429 = @lento;
        error_page 502 503 504 = @reiniciando;

        proxy_pass http://127.0.0.1:8090/api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un guardado con PDF y fotos tarda segundos; el servicio corta a los 120 s
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering on;
    }

    # Desde fuera solo {"ok": true}; el detalle se ve en el servidor: curl -s 127.0.0.1:8090/salud
    location = /salud {
        proxy_pass http://127.0.0.1:8090/salud;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }

    location @lento {
        default_type application/json;
        add_header Access-Control-Allow-Origin $capri_origen always;
        add_header Vary Origin always;
        return 200 '{"ok":false,"codigo":"LIMITE","error":"Demasiadas llamadas seguidas desde esta conexión. Espera unos segundos y vuelve a intentar."}';
    }

    location @reiniciando {
        default_type application/json;
        add_header Access-Control-Allow-Origin $capri_origen always;
        add_header Vary Origin always;
        return 200 '{"ok":false,"codigo":"REINICIO","error":"CAPRI se está actualizando. Intenta de nuevo en un minuto; si guardabas algo, revisa antes de repetir."}';
    }
}
