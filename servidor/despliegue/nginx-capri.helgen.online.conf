# capri.helgen.online — API de CAPRI (etapa 1; docs/servidor-etapa-1.md §10.3). Lo instala despliegue/nginx-capri.sh
# (respaldo, nginx -t, pruebas y regreso automático) en /etc/nginx/sites-available/capri.helgen.online.conf. Nunca toca el
# archivo de drogheda.helgen.online: los nombres de zonas y variables de aquí empiezan con "capri".
#
# Certificado: certbot certonly --webroot (reto ACME en /var/www/letsencrypt). certbot NO edita este archivo (con
# drogheda sí lo hizo: "managed by Certbot"); la renovación es la misma de drogheda (certbot.timer) y recarga nginx con
# el --deploy-hook que guarda certbot en /etc/letsencrypt/renewal/capri.helgen.online.conf.
#
# Detrás: el contenedor capri en 127.0.0.1:8090 (servidor/docker-compose.yml). La interfaz sigue en Cloudflare y llama
# POST text/plain a https://capri.helgen.online/api: petición "simple" (el navegador no manda OPTIONS antes). El servicio
# pone Access-Control-Allow-Origin en sus respuestas; aquí, en las que contesta nginx (límite, archivo grande, reinicio).

limit_req_zone $binary_remote_addr zone=capri_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=capri_salud:1m rate=30r/m;

# El único origen de navegador que puede leer las respuestas: la interfaz en Cloudflare. Con expresión regular a
# propósito: como llave exacta, sus 54 caracteres no caben en map_hash_bucket_size (64) y nginx -t falla
map $http_origin $capri_origen {
    default "";
    "~^https://cotizador-helgen\.cotizador-helgen\.workers\.dev$" $http_origin;
    "https://capri.helgen.online" $http_origin;
}
# Una llamada que trae Origin de otro sitio se rechaza aquí; sin Origin pasa (curl, la herramienta de sombra)
map $http_origin $capri_origen_ajeno {
    default 1;
    "" 0;
    "~^https://cotizador-helgen\.cotizador-helgen\.workers\.dev$" 0;
    "https://capri.helgen.online" 0;
}

# ---- puerto 80 (nginx-capri.sh certificado instala solo este bloque para que certbot pueda emitir)
server {
    listen 80;
    listen [::]:80;
    server_name capri.helgen.online;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
# ---- fin del puerto 80

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name capri.helgen.online;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/capri.helgen.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capri.helgen.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/capri.access.log;
    error_log /var/log/nginx/capri.error.log warn;

    # Los archivos viajan en base64 dentro del JSON: un comprobante o una cotización de 10 MB son ~13.4 MB y una recepción
    # trae una foto por renglón. 50 MB = el límite del propio servicio (limiteBytes); pasado eso, un JSON que la interfaz
    # sí puede leer (@grande) en lugar de la página 413 de nginx
    client_max_body_size 50m;
    client_body_buffer_size 1m;

    location = /api {
        error_page 403 = @ajeno;
        if ($capri_origen_ajeno) { return 403; }

        # Por IP, como drogheda (zonas propias, burst sin espera, 429 → JSON). La oficina sale por una sola IP: holgado
        # (cada pestaña consulta cada 20 s; un bootstrap y una ráfaga de guardados caben en el burst)
        limit_req zone=capri_api burst=80 nodelay;
        limit_req_status 429;
        error_page 429 = @lento;
        error_page 413 = @grande;
        error_page 502 503 504 = @reiniciando;

        proxy_pass http://127.0.0.1:8090/api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Guardar con PDF: ~15 s en Apps Script (aquí 0.3–0.8 s de Chromium); con fotos y correos, segundos. El servicio
        # corta a los 120 s con su propio JSON ("TIEMPO"): nginx espera más para no cortar antes que él
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering on;
    }

    # Desde fuera solo {"ok": true}; el detalle, dentro del contenedor: docker compose exec capri node herramientas/admin.js salud
    location = /salud {
        limit_req zone=capri_salud burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090/salud;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = / { return 302 /cotizador/; }

    # Solo los archivos estáticos de web/; el repositorio y la configuración privada quedan fuera de esta raíz.
    location / {
        root /srv/projects/capri/web;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location @ajeno {
        default_type application/json;
        return 403 '{"ok":false,"codigo":"ORIGEN","error":"Esta API solo atiende a la interfaz de CAPRI."}';
    }

    location @lento {
        default_type application/json;
        add_header Access-Control-Allow-Origin $capri_origen always;
        add_header Vary Origin always;
        return 200 '{"ok":false,"codigo":"LIMITE","error":"Demasiadas llamadas seguidas desde esta conexión. Espera unos segundos y vuelve a intentar."}';
    }

    location @grande {
        default_type application/json;
        add_header Access-Control-Allow-Origin $capri_origen always;
        add_header Vary Origin always;
        return 200 '{"ok":false,"codigo":"GRANDE","error":"Los archivos pesan demasiado para una sola llamada (máx. 50 MB entre todos). Manda menos fotos a la vez o archivos más ligeros."}';
    }

    location @reiniciando {
        default_type application/json;
        add_header Access-Control-Allow-Origin $capri_origen always;
        add_header Vary Origin always;
        return 200 '{"ok":false,"codigo":"REINICIO","error":"CAPRI se está actualizando. Intenta de nuevo en un minuto; si guardabas algo, revisa antes de repetir."}';
    }
}
