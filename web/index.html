<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotizador Helgen</title>
<meta name="description" content="Acceso al cotizador interno de Helgen Servicios Especializados.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/isologo-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2C3C5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #2C3C5B;
    --aqua: #51F3DA;
    --teal: #0AC5A8;
    --fondo: #F2F4F7;
    --texto: #2C3C5B;
    --tarjeta: #FFFFFF;
    --suave: #5B6B87;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fondo: #1A2438;
      --texto: #F2F4F7;
      --tarjeta: #2C3C5B;
      --suave: #B8C3D6;
    }
  }
  :root[data-theme="dark"] {
    --fondo: #1A2438;
    --texto: #F2F4F7;
    --tarjeta: #2C3C5B;
    --suave: #B8C3D6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--fondo);
    color: var(--texto);
    font-family: 'Roboto Mono', monospace;
  }
  header {
    background: var(--azul);
    padding: 20px 16px;
    border-bottom: 4px solid var(--aqua);
  }
  header img { display: block; height: 40px; width: auto; margin: 0 auto; }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .tarjeta {
    width: 100%;
    max-width: 440px;
    background: var(--tarjeta);
    border-radius: 12px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(44, 60, 91, .12);
  }
  h1 {
    font-family: 'League Spartan', Arial, sans-serif;
    font-size: 32px;
    margin: 0 0 12px;
  }
  p { margin: 0 0 24px; line-height: 1.6; font-size: 14px; color: var(--suave); }
  .btn {
    display: inline-block;
    font-family: 'League Spartan', Arial, sans-serif;
    font-size: 18px;
    text-decoration: none;
    background: var(--aqua);
    color: var(--azul);
    padding: 14px 28px;
    border-radius: 8px;
    transition: background .15s;
  }
  .btn:hover, .btn:focus-visible { background: var(--teal); color: #FFFFFF; }
  .nota { margin: 20px 0 0; font-size: 12px; }
  footer { text-align: center; font-size: 12px; padding: 16px; color: var(--suave); }
</style>
</head>
<body>
  <header>
    <img src="logo-helgen-blanco.png" alt="Helgen">
  </header>
  <main>
    <div class="tarjeta">
      <h1>Cotizador Helgen</h1>
      <p>Crea cotizaciones de Helgen y Helgen Energy, consulta el historial y el catálogo de productos.</p>
      <a class="btn" href="cotizador/">Abrir el cotizador</a>
      <p class="nota">Entra con tu cuenta @helgen.tech.</p>
    </div>
  </main>
  <footer>Helgen Servicios Especializados</footer>
</body>
</html>
